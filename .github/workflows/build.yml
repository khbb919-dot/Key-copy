name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المشروع لا يحتوي مجلد android؛ يتم توليده هنا تلقائيًا
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name key_copy --org com.keycopy .

      - name: Set app label
        run: sed -i 's/android:label="[^"]*"/android:label="نسخ المفاتيح"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: key-copy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
